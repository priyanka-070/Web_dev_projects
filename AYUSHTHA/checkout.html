<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | Ayushtha</title><link rel="stylesheet" href="css/style.css"></head><body><div id="navbar"></div><main class="section"><div class="page-title"><span class="eyebrow">STEP 1 OF 3</span><h1>Delivery Details</h1></div><div class="checkout-grid"><form class="form-card" onsubmit="saveAddress(event)"><h2>Delivery Address</h2><div class="form-grid"><input id="name" required placeholder="Full Name"><input id="phone" required pattern="[0-9]{10}" placeholder="Mobile Number"><input id="email" type="email" required placeholder="Email"><input id="pin" required placeholder="PIN Code"><input class="full" id="address" required placeholder="House / Flat / Street"><input id="city" required placeholder="City"><input id="state" required placeholder="State"><input class="full" id="landmark" placeholder="Landmark (optional)"></div><button class="btn" type="submit">Continue to Payment →</button></form><div id="checkoutSummary" class="summary-card"></div></div></main><div id="footer"></div><script src="js/products.js"></script><script src="js/script.js"></script><script>renderCheckout()</script></body></html>
